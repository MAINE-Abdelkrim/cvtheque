[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-engine"
version = "1.0.0"
description = "Deterministic CV-to-job matching engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.111,<1", "uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["performance: MVP-scale performance checks with deliberately generous thresholds"]

[tool.setuptools.packages.find]
include = ["app*"]
